<!doctype html>
<meta charset="utf-8">
<title>HEIC pipeline verification</title>
<style>
  body { font: 14px/1.6 ui-monospace, monospace; padding: 20px; }
  #out { white-space: pre-wrap; }
  img { max-width: 240px; border: 2px solid #333; margin-right: 12px; vertical-align: top; }
  .ok { color: #0a7; } .bad { color: #c00; }
</style>
<h1>HEIC pipeline verification</h1>
<div id="out">running…</div>
<div id="shots"></div>
<script type="module">
import { prepareImageForUpload, readExifOrientation, isHeic } from "./images.js";

const out = document.getElementById("out");
const shots = document.getElementById("shots");
const lines = [];
let failures = 0;
function log(ok, msg) {
  failures += ok ? 0 : 1;
  lines.push(`${ok ? "PASS" : "FAIL"}  ${msg}`);
  out.innerHTML = lines.map(l =>
    `<span class="${l.startsWith("PASS") ? "ok" : "bad"}">${l}</span>`).join("\n");
}

// Build a JPEG carrying EXIF orientation=6 (rotate 90 CW) so the orientation
// path is exercised on a file that really declares it.
function jpegWithOrientation(orientation, w, h) {
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#c33"; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "#37c"; ctx.fillRect(0, 0, w, Math.round(h / 4));
  return new Promise((resolve) => canvas.toBlob(async (blob) => {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    // APP1/Exif segment with a single IFD0 entry: 0x0112 Orientation (SHORT).
    const exif = [
      0xFF,0xE1, 0x00,0x22, 0x45,0x78,0x69,0x66, 0x00,0x00,
      0x4D,0x4D, 0x00,0x2A, 0x00,0x00,0x00,0x08,
      0x00,0x01,
      0x01,0x12, 0x00,0x03, 0x00,0x00,0x00,0x01, (orientation>>8)&0xff, orientation&0xff, 0x00,0x00,
      0x00,0x00,0x00,0x00,
    ];
    const merged = new Uint8Array(2 + exif.length + (bytes.length - 2));
    merged.set([0xFF,0xD8], 0);
    merged.set(exif, 2);
    merged.set(bytes.subarray(2), 2 + exif.length);
    resolve(new File([merged], "oriented.jpg", { type: "image/jpeg" }));
  }, "image/jpeg", 0.9));
}

try {
  // ---- 1. The real HEIC ----------------------------------------------------
  const heicBytes = await (await fetch("./real-photo.heic")).arrayBuffer();
  const heicFile = new File([heicBytes], "IMG_4021.HEIC", { type: "image/heic" });
  log(isHeic(heicFile), `isHeic() detects a real HEIC (${heicBytes.byteLength} bytes)`);

  const magic = new TextDecoder().decode(new Uint8Array(heicBytes, 4, 8));
  log(magic === "ftypheic", `fixture is genuine HEIC, not a renamed file (brand=${magic})`);

  const t0 = performance.now();
  const result = await prepareImageForUpload(heicFile);
  const ms = Math.round(performance.now() - t0);

  log(result.blob.size > 0, `HEIC converted -> ${result.blob.type}, ${result.blob.size} bytes, ${ms}ms`);
  log(result.blob.type === "image/webp" || result.blob.type === "image/jpeg",
      `output is web-renderable (${result.blob.type})`);
  log(result.converted === true, "result flagged as converted");
  log(result.width === 800 && result.height === 800,
      `dimensions preserved (${result.width}x${result.height})`);

  // The real proof: the converted blob decodes in an <img>, which is exactly
  // what failed before this change.
  const url = URL.createObjectURL(result.blob);
  const rendered = await new Promise((res) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = url;
  });
  log(rendered !== null && rendered.naturalWidth > 0,
      `converted HEIC RENDERS in an <img> (${rendered ? rendered.naturalWidth + "x" + rendered.naturalHeight : "failed"})`);
  if (rendered) { rendered.title = "converted HEIC"; shots.appendChild(rendered); }

  // ---- 2. HEIC that isn't really an image ---------------------------------
  const junk = new File([new Uint8Array([0,0,0,32,102,116,121,112,104,101,105,99,1,2,3])],
                        "broken.heic", { type: "image/heic" });
  let rejected = false;
  try { await prepareImageForUpload(junk); } catch { rejected = true; }
  log(rejected, "an undecodable HEIC is REJECTED, never uploaded");

  // ---- 3. EXIF orientation -------------------------------------------------
  const oriented = await jpegWithOrientation(6, 400, 200);
  const parsed = await readExifOrientation(oriented);
  log(parsed === 6, `readExifOrientation() reads orientation=6 from a real EXIF block (got ${parsed})`);

  const orientedOut = await prepareImageForUpload(oriented);
  log(orientedOut.width === 200 && orientedOut.height === 400,
      `orientation 6 rotates 400x200 -> ${orientedOut.width}x${orientedOut.height} (axes swapped)`);
  const oimg = new Image();
  oimg.src = URL.createObjectURL(orientedOut.blob);
  oimg.title = "orientation-corrected";
  shots.appendChild(oimg);

  // ---- 4. Ordinary JPEG passes through ------------------------------------
  const plain = await jpegWithOrientation(1, 300, 300);
  const plainOut = await prepareImageForUpload(plain);
  log(plainOut.width === 300 && plainOut.height === 300, "unoriented JPEG passes through unrotated");

  // ---- 5. Empty file -------------------------------------------------------
  let emptyRejected = false;
  try { await prepareImageForUpload(new File([], "empty.jpg", { type: "image/jpeg" })); }
  catch { emptyRejected = true; }
  log(emptyRejected, "an empty file is rejected");
} catch (err) {
  log(false, "harness threw: " + err.message + "\n" + err.stack);
}

lines.push("");
lines.push(failures === 0 ? "ALL CHECKS PASSED" : `${failures} CHECK(S) FAILED`);
out.innerHTML = lines.map(l =>
  `<span class="${l.startsWith("FAIL") || l.includes("FAILED") ? "bad" : "ok"}">${l}</span>`).join("\n");
document.title = failures === 0 ? "HEIC OK" : "HEIC FAILED";
</script>
