name: backend-contract-and-routing

on:
  pull_request:
  push:
  # The evaluation job below is the reason this runs broadly rather than on a
  # path filter: prompts, retrieval, corpora, and orchestration all move these
  # numbers, and a path filter that misses one lets a regression through
  # unmeasured.

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan can see every blob, not just the tip.
          fetch-depth: 0
      - name: Scan tracked files and history for credentials
        run: ./scripts/scan_secrets.sh --history

  routing-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must match .python-version, which is what Railway builds with.
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run portable routing and evaluation regressions
        run: python -B -m pytest -p no:cacheprovider tests/routing tests/test_evaluation.py
      - name: Run deployment-hardening contracts
        # Explicitly isolated from any ambient .env so the config guards are
        # asserted against the values the test passes, not the runner's.
        run: python -B -m pytest -p no:cacheprovider tests/test_deployment_readiness.py
      - name: Type-check application contracts and control flow
        run: mypy app --no-incremental

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      # The gate. Emergency recall must be 100%; a regression fails the build.
      # Nothing else here can fail it — quality metrics move for legitimate
      # reasons, and a gate that cries wolf is a gate people learn to ignore.
      - name: Emergency recall and routing gate
        env:
          RUNTIME_MODE: development
        run: python -B -m app.evaluation.harness --routing

      - name: Golden dataset and quality metrics (advisory)
        env:
          RUNTIME_MODE: development
        run: |
          python -B -m app.evaluation.harness --record | tee eval-report.txt
          echo '### Evaluation report' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat eval-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Results are kept per run so trends are visible, rather than only ever
      # seeing the latest number with nothing to compare it against.
      - name: Upload evaluation history
        uses: actions/upload-artifact@v4
        with:
          name: eval-history-${{ github.sha }}
          path: |
            eval-report.txt
            tests/eval/history.jsonl
          retention-days: 90

  deployment-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exactly what production installs
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Confirm the app imports under the locked dependency set
        # Catches a lockfile that drifted from pyproject.toml before Railway
        # discovers it mid-deploy.
        run: RUNTIME_MODE=development python -c "import app.main; print('ok')"
